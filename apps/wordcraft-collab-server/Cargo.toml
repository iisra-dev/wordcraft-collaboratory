[package]
name = "wordcraft-collab-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft Collaborative server: authentication, permissions, document actors, SQLite persistence and the WebSocket endpoint"

[[bin]]
name = "wordcraft-collab-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
wordcraft-collab-protocol = { workspace = true }
wordcraft-collab-model = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-docx = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
getrandom = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# C3.1/C3.3: the real client transport against a real server (tests/client.rs).
wordcraft-collab-client = { workspace = true, features = ["transport"] }
tower = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
