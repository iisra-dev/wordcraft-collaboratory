[package]
name = "wordcraft-collab-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft Collaborative client: connection state, pending operations, presence and the bridge to the editing session"

# Sans-I/O core: the state machine and queues here build for wasm (this crate is L5, so
# `cargo xtask wasm` checks it). The native WebSocket transport (tokio + tungstenite) will sit
# behind a non-default `transport` feature that only apps/wordcraft enables (design §4, C3.1).
# wordcraft-engine (L4) is a dependency for the Session bridge (C4.2); it builds for wasm too.

[features]
# Native WebSocket transport (C3.1): tokio + tungstenite + rustls with the system's certificates.
transport = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:log", "dep:ureq", "dep:getrandom", "dep:uuid", "dep:sha2", "dep:base64", "dep:webbrowser", "dep:serde"]

[lints]
workspace = true

[dependencies]
wordcraft-collab-protocol = { workspace = true }
wordcraft-collab-model = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true, features = ["rustls-tls-native-roots"] }
futures-util = { workspace = true, optional = true }
log = { workspace = true, optional = true }
# Publishing a document (HTTP POST of its DOCX): already in the tree through craft-update.
ureq = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# OIDC sign-in with PKCE (oidc.rs).
sha2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
webbrowser = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
uuid = { workspace = true }
